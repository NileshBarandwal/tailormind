[phases.setup]
nixPkgs = [
  "python311",
  "pango",
  "harfbuzz",
  "gdk-pixbuf",
  "libffi",
  "cairo",
  "fontconfig",
  "freetype",
]

[phases.install]
cmds = [
  "python3 -m venv /opt/venv",
  ". /opt/venv/bin/activate && pip install --upgrade pip",
  ". /opt/venv/bin/activate && pip install -r backend/requirements.txt",
]

[start]
cmd = "/opt/venv/bin/uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT"
